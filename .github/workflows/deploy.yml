name: MetalGest CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: metalgest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: API tests
        run: npm run test:api

  smoke-docker:
    name: Smoke Test Docker Stack
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Smoke test stack
        run: npm run smoke:docker

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop containers
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: smoke-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_PATH != '' && secrets.VPS_SSH_KEY != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p ${{ secrets.VPS_PATH }}
            cd ${{ secrets.VPS_PATH }}
            if [ "$(find . -mindepth 1 -maxdepth 1 ! -name '.env' | wc -l)" -gt 0 ]; then
              mkdir -p "${{ secrets.VPS_PATH }}-backup"
              TIMESTAMP="$(date +%Y%m%d_%H%M%S)"
              BACKUP_TARGET="${{ secrets.VPS_PATH }}-backup/${TIMESTAMP}"
              mkdir -p "$BACKUP_TARGET"
              find . -mindepth 1 -maxdepth 1 ! -name '.env' -exec cp -R {} "$BACKUP_TARGET" \;
            fi
            docker compose down --remove-orphans || true
            find . -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +

      - name: Sync repository to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "apps,docker,packages,scripts,entrypoint.sh,rollback.sh,package.json,package-lock.json,docker-compose.yml,.env.example,turbo.json,tsconfig.base.json"
          target: ${{ secrets.VPS_PATH }}

      - name: Run deploy commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH }}
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            chmod +x entrypoint.sh rollback.sh || true
            docker compose up -d --build

            for attempt in $(seq 1 40); do
              if curl -fsS http://localhost:${APP_PORT:-80}/api/health > /dev/null; then
                echo "Health check passed on attempt ${attempt}"
                exit 0
              fi

              echo "Waiting for application to become healthy (${attempt}/40)"
              sleep 3
            done

            echo "Deployment failed health check"
            docker compose logs --tail=200
            exit 1
