# Docker Compose - MetalGest Monorepo
# Backend será implementado posteriormente com Node.js + TypeScript + Prisma + PostgreSQL

services:
  # Frontend React/Vite
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    environment:
      VITE_APP_NAME: MetalGest
      VITE_APP_VERSION: "2.0.0"
    expose:
      - "3000"
    networks:
      - metalgest-network

  # Nginx Proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3010:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
    networks:
      - metalgest-network

networks:
  metalgest-network:
    driver: bridge
