services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: metalgest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metalgest123}
      POSTGRES_DB: metalgest
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - metalgest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metalgest -d metalgest"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://metalgest:${POSTGRES_PASSWORD:-metalgest123}@postgres:5432/metalgest?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-jwt-key-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-this-refresh-secret-key}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3010,http://localhost:3000}
      APP_DOMAIN: ${APP_DOMAIN:-metalgest.com.br}
      APP_DOMAIN_WWW: ${APP_DOMAIN_WWW:-www.metalgest.com.br}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}
      ULTRAZEND_API_URL: ${ULTRAZEND_API_URL:-https://www.ultrazend.com.br/api}
      ULTRAZEND_FROM_EMAIL: ${ULTRAZEND_FROM_EMAIL:-}
      ULTRAZEND_FROM_NAME: ${ULTRAZEND_FROM_NAME:-MetalGest}
      ULTRAZEND_API_KEY: ${ULTRAZEND_API_KEY:-}
      ULTRAZEND_ACCESS_TOKEN: ${ULTRAZEND_ACCESS_TOKEN:-}
      ULTRAZEND_WEBHOOK_SECRET: ${ULTRAZEND_WEBHOOK_SECRET:-}
    expose:
      - "3001"
    volumes:
      - ./apps/api/uploads:/app/apps/api/uploads
      - ./apps/api/logs:/app/apps/api/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metalgest-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - metalgest-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - metalgest-network

volumes:
  postgres_data:

networks:
  metalgest-network:
    driver: bridge
